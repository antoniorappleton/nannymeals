<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NannyMeals — Planeamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="src/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="manifest" href="manifest.json" />
    <script type="module" src="src/auth.js?v=32"></script>
    <script>
      (function() {
        const saved = localStorage.getItem('nm_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
      })();
    </script>
    <style>
      body { overscroll-behavior-y: contain; }
      .swipe-card-img {
        width: 100%;
        height: 60%;
        object-fit: cover;
      }
      .meal-info {
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
    </style>
  </head>

  <body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
    <div class="app-container h-full flex flex-col">
      
      <!-- Instagram-Style Header -->
      <header class="header-ig">
        <div class="flex items-center gap-3">
          <a href="perfil.html" class="size-10 rounded-full overflow-hidden bg-slate-200 dark:bg-slate-800 border-2 border-white dark:border-slate-700 shadow-sm">
            <img id="header-profile-img" src="assets/images/hero.webp" alt="Profile" class="w-full h-full object-cover" />
          </a>
          <span class="text-lg font-black tracking-tight">NannyMeals</span>
        </div>
        <div class="flex items-center gap-4">
          <button id="btn-refresh-plan" class="text-slate-400 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">refresh</span>
          </button>
          <a href="grocery.html" class="relative text-slate-900 dark:text-white">
            <span class="material-symbols-outlined text-2xl">shopping_cart</span>
            <span id="cart-badge" class="absolute -top-1.5 -right-1.5 size-5 bg-primary text-slate-900 text-[10px] font-black rounded-full flex items-center justify-center border-2 border-white dark:border-slate-900 hidden">0</span>
          </a>
        </div>
      </header>

      <main class="flex-1 flex flex-col overflow-hidden bg-slate-50 dark:bg-slate-950">
        
        <!-- Horizontal Day Navigation -->
        <div class="day-strip no-scrollbar" id="day-navigation">
          <!-- Generated by JS -->
        </div>

        <!-- Swipe Container -->
        <div class="swipe-container" id="swipe-container">
          <div id="loading-suggestions" class="flex flex-col items-center justify-center gap-4 text-muted animate-fade-in">
            <div class="size-16 rounded-3xl bg-white dark:bg-slate-900 shadow-sm flex items-center justify-center animate-pulse">
              <span class="material-symbols-outlined text-4xl">auto_awesome</span>
            </div>
            <p class="font-bold text-sm">A preparar sugestões...</p>
          </div>
          <!-- Cards injected by JS -->
        </div>

        <!-- Empty State (when no more cards for current day) -->
        <div id="empty-day-state" class="hidden flex-1 flex flex-col items-center justify-center p-10 text-center gap-4 animate-fade-in">
           <div class="size-20 rounded-full bg-primary/10 text-primary flex items-center justify-center mb-2">
             <span class="material-symbols-outlined text-4xl">check_circle</span>
           </div>
           <h3 class="text-xl font-black">Dia Planeado!</h3>
           <p class="text-sm text-muted">Boa escolha. Podes passar para o próximo dia ou rever a tua escolha.</p>
           <button id="btn-next-day" class="nm-btn nm-btn-primary px-10">Próximo Dia</button>
        </div>

        <!-- Confirmation Bar -->
        <div id="confirmation-bar" class="hidden px-5 py-4 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 animate-fade-up">
          <button id="btn-finalize-plan" class="nm-btn nm-btn-primary w-full">
            <span class="material-symbols-outlined">check_circle</span>
            Finalizar Plano da Semana
          </button>
        </div>

      </main>

      <!-- Bottom Nav (imported via script) -->
      <div id="bottom-nav-placeholder"></div>
    </div>

    <script type="module">
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";
      import { auth } from "./src/firebase-init.js";
      import {
        getHousehold,
        getMealRecommendations,
        getRecipe,
        confirmPlan,
        generateGroceryListFromPlan
      } from "./src/db.js";

      // State
      let currentDayIndex = 0;
      let selectedMeals = [null, null, null, null, null, null, null];
      let suggestions = []; // Array of arrays (suggestions per day)
      let currentUser = null;
      let household = null;
      let activeSuggestions = []; // Suggestions for the CURRENT day

      const days = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
      const dayNames = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo"];

      // DOM Elements
      const dayNav = document.getElementById('day-navigation');
      const swipeContainer = document.getElementById('swipe-container');
      const loadingState = document.getElementById('loading-suggestions');
      const emptyState = document.getElementById('empty-day-state');
      const confirmationBar = document.getElementById('confirmation-bar');
      const finalizeBtn = document.getElementById('btn-finalize-plan');
      const nextDayBtn = document.getElementById('btn-next-day');

      // Initialize
      onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        currentUser = user;
        
        // Load profile
        household = await getHousehold(user.uid);
        if (!household) { window.location.href = "onboarding.html"; return; }

        // Load existing plan if any
        const lastPlan = await getLastPlan(user.uid);
        if (lastPlan && lastPlan.status === 'active') {
          // If we already have a plan, maybe we should just show the results
          // But for this "Interactive" version, let's assume we are building a new one
          // if the user clicks "Refresh" or hasn't finished one.
        }

        renderDayStrip();
        loadSuggestions();
      });

      function renderDayStrip() {
        dayNav.innerHTML = '';
        days.forEach((day, i) => {
          const chip = document.createElement('div');
          chip.className = `day-chip ${i === currentDayIndex ? 'active' : ''} ${selectedMeals[i] ? 'completed' : ''}`;
          chip.onclick = () => switchDay(i);
          chip.innerHTML = `
            <div class="day-chip-circle">
              ${selectedMeals[i] ? '<span class="material-symbols-outlined text-lg">check</span>' : day[0]}
            </div>
            <span class="day-chip-label">${day}</span>
          `;
          dayNav.appendChild(chip);
        });
      }

      async function loadSuggestions() {
        loadingState.classList.remove('hidden');
        swipeContainer.innerHTML = '';
        swipeContainer.appendChild(loadingState);

        // Fetch recommendations from db.js logic
        const count = 21;
        const recs = await getMealRecommendations(household.id, count);
        
        // Fetch a pool of soups
        const { db } = await import("./src/firebase-init.js");
        const { collection, getDocs, query, where, limit } = await import("https://www.gstatic.com/firebasejs/11.3.1/firebase-firestore.js");
        const soupPool = await getDocs(query(collection(db, "recipes"), where("tags", "array-contains", "sopa"), limit(5)));
        const soups = soupPool.docs.map(d => ({ id: d.id, ...d.data() }));

        // Group them (3 per day for a week)
        suggestions = [];
        for (let i = 0; i < 7; i++) {
          const dayRecs = recs.slice(i * 3, (i + 1) * 3).map((r, idx) => {
             // Assign a soup from the pool
             const soup = soups.length > 0 ? soups[(i + idx) % soups.length] : null;
             return {
                ...r,
                soup: soup ? { 
                  recipeId: soup.id, 
                  name: soup.name, 
                  image: soup.image, 
                  ingredients: soup.ingredients || [] 
                } : null
             };
          });
          suggestions.push(dayRecs);
        }

        renderDayCards();
      }

      function renderDayCards() {
        loadingState.classList.add('hidden');
        emptyState.classList.add('hidden');
        swipeContainer.querySelectorAll('.swipe-card').forEach(c => c.remove());

        activeSuggestions = suggestions[currentDayIndex] || [];
        
        if (selectedMeals[currentDayIndex]) {
          showEmptyState();
          return;
        }

        if (activeSuggestions.length === 0) {
           swipeContainer.innerHTML = `<p class="text-muted text-sm font-bold">Sem sugestões para este dia.</p>`;
           return;
        }

        // Create cards (stacked)
        activeSuggestions.forEach((recipe, idx) => {
          createCard(recipe, idx);
        });
      }

      function createCard(recipe, index) {
        const card = document.createElement('div');
        card.className = 'swipe-card';
        card.style.zIndex = activeSuggestions.length - index;
        card.style.transform = `scale(${1 - index * 0.05}) translateY(${index * 15}px)`;
        
        card.innerHTML = `
          <div class="swipe-card-overlay like"><div class="swipe-stamp like">Escolher</div></div>
          <div class="swipe-card-overlay skip"><div class="swipe-stamp skip">Outro dia</div></div>
          <img src="${recipe.image || 'assets/images/recipe_default.png'}" class="swipe-card-img" alt="${recipe.name}">
          <div class="meal-info">
            <div>
              <div class="flex justify-between items-start mb-2">
                <h3 class="text-xl font-black leading-tight">${recipe.name}</h3>
                <span class="nm-badge bg-primary/10 text-primary">${recipe.prepTime}m</span>
              </div>
              <div class="flex gap-4 text-xs font-bold text-muted">
                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">euro</span> ${recipe.pricePerServing || '1.5'}€</span>
                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-sm">local_fire_department</span> ${recipe.calories || '450'} kcal</span>
              </div>
            </div>
            
            <div class="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-2xl border border-slate-100 dark:border-slate-800 flex items-center gap-3">
              ${recipe.soup?.image ? `<img src="${recipe.soup.image}" class="size-8 rounded-lg object-cover shadow-sm">` : '<span class="text-xl">🥣</span>'}
              <div>
                <p class="text-[9px] font-black uppercase text-muted tracking-widest">Sugerimos com</p>
                <p class="text-sm font-bold text-slate-700 dark:text-slate-200">${recipe.soup ? recipe.soup.name : 'Sopa de Legumes'}</p>
              </div>
            </div>

            <div class="flex justify-between items-center pt-2">
              <button class="size-12 rounded-full border border-red-100 text-red-500 flex items-center justify-center hover:bg-red-50" onclick="event.stopPropagation(); handleManualSwipe('left')">
                <span class="material-symbols-outlined">close</span>
              </button>
              <button class="nm-btn nm-btn-ghost text-xs" onclick="openDetails('${recipe.id}')">Ver Receita</button>
              <button class="size-12 rounded-full bg-primary text-slate-900 flex items-center justify-center shadow-glow" onclick="event.stopPropagation(); handleManualSwipe('right')">
                <span class="material-symbols-outlined">favorite</span>
              </button>
            </div>
          </div>
        `;

        initTouch(card);
        swipeContainer.appendChild(card);
      }

      // Touch Logic
      let startX = 0;
      let currentX = 0;
      let activeCard = null;

      function initTouch(card) {
        card.addEventListener('touchstart', e => {
          startX = e.touches[0].clientX;
          activeCard = card;
          card.style.transition = 'none';
        });

        card.addEventListener('touchmove', e => {
          if (!activeCard) return;
          currentX = e.touches[0].clientX - startX;
          const rotation = currentX / 20;
          card.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;
          
          // Overlays
          const likeOverlay = card.querySelector('.overlay.like');
          const skipOverlay = card.querySelector('.overlay.skip');
          if (currentX > 50) {
            card.querySelector('.swipe-card-overlay.like').style.opacity = Math.min(currentX / 150, 1);
            card.querySelector('.swipe-card-overlay.skip').style.opacity = 0;
          } else if (currentX < -50) {
            card.querySelector('.swipe-card-overlay.skip').style.opacity = Math.min(-currentX / 150, 1);
            card.querySelector('.swipe-card-overlay.like').style.opacity = 0;
          } else {
            card.querySelector('.swipe-card-overlay.like').style.opacity = 0;
            card.querySelector('.swipe-card-overlay.skip').style.opacity = 0;
          }
        });

        card.addEventListener('touchend', e => {
          if (!activeCard) return;
          card.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
          
          if (currentX > 120) {
            swipe('right');
          } else if (currentX < -120) {
            swipe('left');
          } else {
            card.style.transform = `translateX(0) rotate(0)`;
            card.querySelector('.swipe-card-overlay.like').style.opacity = 0;
            card.querySelector('.swipe-card-overlay.skip').style.opacity = 0;
          }
          activeCard = null;
          currentX = 0;
        });
      }

      window.handleManualSwipe = (dir) => {
        const topCard = swipeContainer.querySelector('.swipe-card:last-child');
        if (topCard) {
           activeCard = topCard;
           swipe(dir);
           activeCard = null;
        }
      };

      function swipe(dir) {
        if (!activeCard) return;
        const moveX = dir === 'right' ? 1000 : -1000;
        activeCard.style.transform = `translateX(${moveX}px) rotate(${dir === 'right' ? 45 : -45}deg)`;
        
        const removedRecipe = activeSuggestions.pop();
        
        if (dir === 'right') {
          selectMeal(removedRecipe);
        } else {
          // Recycle suggestion to bottom of stack if needed, or just remove
          setTimeout(() => {
            activeCard.remove();
            if (activeSuggestions.length === 0) showEmptyState();
          }, 300);
        }
      }

      function selectMeal(recipe) {
        selectedMeals[currentDayIndex] = recipe;
        setTimeout(() => {
          activeCard.remove();
          renderDayStrip();
          showEmptyState();
          checkIfComplete();
        }, 300);
      }

      function showEmptyState() {
        emptyState.classList.remove('hidden');
        // Hide swipe container internal msg
        swipeContainer.querySelectorAll('.swipe-card').forEach(c => c.classList.add('hidden'));
      }

      function switchDay(index) {
        currentDayIndex = index;
        renderDayStrip();
        renderDayCards();
      }

      nextDayBtn.onclick = () => {
        if (currentDayIndex < 6) {
          switchDay(currentDayIndex + 1);
        }
      };

      function checkIfComplete() {
        const count = selectedMeals.filter(m => m !== null).length;
        if (count >= 5) {
          confirmationBar.classList.remove('hidden');
        }
      }

      finalizeBtn.onclick = async () => {
        finalizeBtn.disabled = true;
        finalizeBtn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span> A criar lista de compras...`;
        
        try {
          // The selectedMeals array contains the recipe objects
          const validMeals = selectedMeals.filter(m => m !== null);
          const planId = await confirmPlan(household.id, validMeals);
          
          // Generate grocery list immediately
          await generateGroceryListFromPlan(planId);
          
          window.location.href = "dashboard.html";
        } catch (err) {
          console.error("Erro ao finalizar plano:", err);
          alert("Erro ao criar o seu plano. Por favor tente novamente.");
          finalizeBtn.disabled = false;
          finalizeBtn.innerHTML = `<span>Finalizar Plano</span>`;
        }
      };

      window.openDetails = async (id) => {
        // Implement modal logic or redirect to recipe page
        alert("Detalhes da receita: " + id);
      };

      // Import Bottom Nav
      fetch('bottom-nav.html').then(r => r.text()).then(html => {
        document.getElementById('bottom-nav-placeholder').innerHTML = html;
        // Trigger the active state script in bottom-nav
        const script = document.createElement('script');
        script.text = html.split('<script>')[1].split('<\/script>')[0];
        document.body.appendChild(script);
      });

    </script>
  </body>
</html>
